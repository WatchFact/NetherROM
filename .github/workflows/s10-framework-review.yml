name: S10 pinned framework and portrait compatibility review
on:
  push:
    branches: [port/s10-v4.0.1]
    paths: ['.github/workflows/s10-framework-review.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /buildenv.sh
            /scripts/
            /unica/configs/
            /platform/exynos9820/config.sh
            /target/beyond2lte/config.sh
            /external/make.sh
            /external/ext4_utils/mke2fs.conf
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            attr bc bison build-essential ccache clang cpio curl e2fsprogs flex ffmpeg \
            git libbrotli-dev libbz2-dev libelf-dev libgtest-dev libncurses-dev \
            libpcre2-dev libprotobuf-dev libssl-dev libunwind-dev libzstd-dev \
            lld lz4 p7zip-full protobuf-compiler python-is-python3 python3 rsync \
            unzip webp wget zip
          sudo modprobe erofs || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore verified extraction tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/s10/tools.sh
      - name: Extract only the pinned source firmware
        shell: bash
        run: |
          set -eo pipefail
          source ./buildenv.sh beyond2lte
          ./scripts/download_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-target
          source_dir="$FW_DIR/SM-S926B_EUX"
          test "$(cat "$source_dir/.extracted")" = "$SOURCE_FIRMWARE_VERSION"
          mkdir framework-review
          cp "$source_dir/.extracted" framework-review/firmware.txt
          # Record sizes before making a capacity decision. This is a read-only
          # firmware inventory; it does not remove ROM or hardware payloads.
          python3 - "$source_dir" <<'PY_CAPACITY'
          import collections,json,os,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1]); directories=collections.Counter(); files=[]; archives=[]
          for path in sorted(root.rglob('*')):
              if path.is_symlink() or not path.is_file(): continue
              name=path.relative_to(root).as_posix(); size=path.stat().st_size
              files.append({'path':name,'size':size})
              parts=Path(name).parts
              for depth in range(1,min(len(parts),5)):
                  directories['/'.join(parts[:depth])]+=size
              if path.suffix in ('.apk','.apex','.capex'):
                  with zipfile.ZipFile(path) as archive:
                      entries=archive.infolist()
                      archives.append({'path':name,'size':size,'uncompressed':sum(x.file_size for x in entries),
                          'stored_bytes':sum(x.file_size for x in entries if x.compress_type==0),
                          'stored_dex':sum(x.file_size for x in entries if x.compress_type==0 and x.filename.endswith('.dex')),
                          'stored_native':sum(x.file_size for x in entries if x.compress_type==0 and x.filename.endswith('.so'))})
          report={'firmware':(root/'.extracted').read_text(),'directories':dict(directories.most_common()),
              'files':sorted(files,key=lambda x:x['size'],reverse=True),
              'archives':sorted(archives,key=lambda x:x['size'],reverse=True)}
          Path('framework-review/capacity.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Exact source firmware payload sizes (largest directories):')
          print(json.dumps(dict(directories.most_common(50)),indent=2))
          print('Largest files:'); print(json.dumps(report['files'][:50],indent=2))
          PY_CAPACITY
          # Keep exact portrait inputs for reviewing the model/backend contract.
          mkdir -p framework-review/portrait
          cp "$source_dir/system/system/cameradata/portrait_data/"*.json framework-review/portrait/
          cp "$source_dir/system/system/lib64/libPortraitSolution.camera.samsung.so" framework-review/portrait/
          readelf -d framework-review/portrait/libPortraitSolution.camera.samsung.so > framework-review/portrait/dynamic.txt
          strings framework-review/portrait/libPortraitSolution.camera.samsung.so > framework-review/portrait/strings.txt
          python3 - "$source_dir" <<'PY_REVIEW'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows={}
          for directory in ('system/system/cameradata/portrait_data','vendor/etc/portrait_data'):
              for path in sorted((root/directory).rglob('*')):
                  if path.is_file():
                      rows[path.relative_to(root).as_posix()]={'size':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          Path('framework-review/portrait/inventory.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('Exact pinned source portrait feature configuration:')
          print((root/'system/system/cameradata/portrait_data/single_bokeh_feature.json').read_text())
          PY_REVIEW
          cp "$source_dir/system/system/framework/services.jar" framework-review/services.jar
          sha256sum framework-review/services.jar | tee framework-review/SHA256.txt
          apktool d --no-res --no-debug-info -o framework-review/decoded framework-review/services.jar
          test -s framework-review/decoded/smali/com/android/server/biometrics/sensors/face/hidl/TestHal.smali
          test -s framework-review/decoded/smali/com/android/server/biometrics/sensors/face/hidl/HidlToAidlCallbackConverter.smali
          # Review the settings and framework migrations together against the
          # same pristine firmware. These inputs never replace clean ROM builds.
          for relative in framework/framework.jar framework/framework-res.apk framework/semwifi-service.jar \
            priv-app/SecSettings/SecSettings.apk priv-app/SettingsProvider/SettingsProvider.apk; do
            name="$(basename "$relative")"
            cp "$source_dir/system/system/$relative" "framework-review/$name"
            sha256sum "framework-review/$name" >> framework-review/SHA256.txt
            if [ "$name" != framework-res.apk ]; then
              apktool d --no-res --no-debug-info -o "framework-review/decoded-$name" "framework-review/$name"
            fi
          done
          # The side fingerprint UI and Wi-Fi feature gates must be reviewed
          # against the same source firmware, not guessed from another R8 layout.
          mapfile -t systemui_paths < <(find "$source_dir" -type f -path '*/priv-app/SystemUI/SystemUI.apk')
          test "${#systemui_paths[@]}" -eq 1
          cp "${systemui_paths[0]}" framework-review/SystemUI.apk
          sha256sum framework-review/SystemUI.apk >> framework-review/SHA256.txt
          apktool d --no-res --no-debug-info -o framework-review/decoded-SystemUI.apk framework-review/SystemUI.apk
      - name: Publish exact framework review inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tar -czf s10-framework-review.tar.gz framework-review
          sha256sum s10-framework-review.tar.gz > s10-framework-review.tar.gz.sha256
          tag="s10-framework-review-${GITHUB_SHA:0:12}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title 'S10 framework port review inputs - not installable' \
            --notes 'Read-only portrait model/backend, framework, Settings, Wi-Fi and SystemUI inputs from pinned S926BXXSHDZI1/S926BOXMHDZI1/S926BXXSHDZI1 source firmware, decoded with the verified S10 build toolchain. These diagnostics support reviewing the legacy framework migrations together. This is not a flashable ROM or a successful ROM build.' \
            s10-framework-review.tar.gz s10-framework-review.tar.gz.sha256
      - name: Preserve review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s10-framework-review-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: framework-review/
